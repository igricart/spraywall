<!doctype html>
<html lang="en">
  <head>
    <script>
      // set the theme before first paint (no white flash); App keeps it in sync after
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1f2226" />
    <title>Spray Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
